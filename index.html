        .glass-card {
            background: rgba(255, 255, 255, 0.85);

        @keyframes shimmer {

        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }

        }
